<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOMA | Support</title>
    <style>
        /* GENEL AYARLAR */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* DİL SEÇİCİ (SAĞ ÜST) */
        .lang-switch {
            position: fixed;
            top: 30px;
            right: 40px;
            z-index: 100;
            font-size: 0.75rem;
            letter-spacing: 0.2rem;
            color: #8E8E96;
            cursor: pointer;
            text-transform: uppercase;
        }
        .lang-switch span {
            transition: color 0.3s ease;
        }
        .lang-switch span:hover {
            color: #ffffff;
        }
        .lang-switch span.active {
            color: #ffffff;
            font-weight: 500;
        }
        .lang-switch .divider {
            margin: 0 8px;
            color: #444;
            pointer-events: none;
        }

        /* ANA SAYFAYA DÖNÜŞ LİNKİ (SOL ÜST) */
        .home-link {
            position: fixed;
            top: 30px;
            left: 40px;
            z-index: 100;
            font-size: 0.75rem;
            letter-spacing: 0.3rem;
            color: #8E8E96;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .home-link:hover {
            color: #ffffff;
        }

        /* 1. KATMAN: SABİT VORTEX ARKA PLANI */
        #glcanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 2. KATMAN: SABİT YILDIZLAR */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            transition: opacity 1.5s ease-in-out;
        }

        /* 3. KATMAN: KAYDIRILABİLİR İÇERİK (SCROLL) */
        .content-layer {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* --- SAYFA BAŞLIĞI --- */
        .policy-hero {
            padding: 9rem 10% 2rem 10%;
            text-align: center;
        }

        .policy-title {
            font-size: 2.1rem;
            font-weight: 300;
            letter-spacing: 0.35rem;
            margin: 0 0 1.2rem 0;
            text-transform: uppercase;
        }

        .last-updated {
            font-size: 0.72rem;
            font-weight: 400;
            color: #666;
            letter-spacing: 0.15rem;
            text-transform: uppercase;
        }

        /* --- İÇERİK BÖLÜMÜ (CAM PANEL) --- */
        .section {
            padding: 2rem 10% 10rem 10%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .glass-panel {
            background: rgba(10, 10, 12, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 4rem;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .policy-panel {
            max-width: 820px;
            text-align: left;
        }

        .policy-panel h3 {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.12rem;
            color: #ffffff;
            margin: 2.6rem 0 1rem 0;
            text-transform: uppercase;
        }

        .policy-panel h3:first-child {
            margin-top: 0;
        }

        .policy-panel p {
            font-size: 0.98rem;
            font-weight: 300;
            color: #a1a1aa;
            line-height: 1.85;
            letter-spacing: 0.02rem;
            margin: 0 0 1.2rem 0;
        }

        .policy-panel ul {
            margin: 0 0 1.2rem 0;
            padding: 0;
            list-style: none;
        }

        .policy-panel li {
            font-size: 0.98rem;
            font-weight: 300;
            color: #a1a1aa;
            line-height: 1.85;
            letter-spacing: 0.02rem;
            padding-left: 1.3rem;
            position: relative;
            margin-bottom: 0.5rem;
        }

        .policy-panel li::before {
            content: '-';
            position: absolute;
            left: 0;
            color: #555;
        }

        .policy-panel strong {
            color: #ffffff;
            font-weight: 500;
        }

        .policy-panel a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .contact-cta {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 0.9rem 2.4rem;
            border-radius: 100px;
            font-size: 0.75rem;
            letter-spacing: 0.25rem;
            text-transform: uppercase;
            text-decoration: none !important;
            transition: all 0.3s ease;
        }

        .contact-cta:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 900px) {
            .home-link {
                font-size: 0.65rem;
                left: 20px;
                top: 24px;
            }
            .lang-switch {
                font-size: 0.65rem;
                right: 20px;
                top: 24px;
            }
            .policy-hero {
                padding: 6rem 6% 1.5rem 6%;
            }
            .policy-title {
                font-size: 1.5rem;
            }
            .section {
                padding: 1rem 5% 6rem 5%;
            }
            .glass-panel {
                padding: 2.2rem 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- ANA SAYFAYA DÖN -->
    <a href="index.html" class="home-link">QOMA</a>

    <!-- DİL SEÇİCİ -->
    <div class="lang-switch">
        <span id="btn-en" class="active" onclick="setLang('en')">ENG</span>
        <span class="divider">|</span>
        <span id="btn-jp" onclick="setLang('jp')">JPN</span>
        <span class="divider">|</span>
        <span id="btn-tr" onclick="setLang('tr')">TUR</span>
    </div>

    <!-- Arka Plan Vortex Shader -->
    <canvas id="glcanvas"></canvas>

    <!-- Bağımsız Yıldızlar -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- KAYDIRILABİLİR İÇERİK KATMANI -->
    <div class="content-layer">

        <div class="policy-hero">
            <h1 class="policy-title" id="t-title">Support</h1>
            <div class="last-updated" id="t-updated">contact@qoma.studio</div>
        </div>

        <div class="section">
            <div class="glass-panel policy-panel" id="t-body">
                <!-- JS ile doldurulacak -->
            </div>
        </div>

    </div>

    <!-- DİL SCRIPTİ -->
    <script>
        const i18n = {
            en: {
                title: "Support",
                updated: "contact@qoma.studio",
                body: `
                    <p>Need help with QOMA? Here's how it works, and how to reach us directly.</p>

                    <h3>Getting Started</h3>
                    <p>QOMA is a single-button instrument. Press it, and the app generates a new ambient sound live, tailored to the mode you've selected (Sleep, Focus, or Space). Nothing ever repeats exactly the same way twice.</p>

                    <h3>Free Listening &amp; Subscription</h3>
                    <p>Every profile in QOMA is available to try for free, up to a daily listening limit. If you'd like unlimited listening time, QOMA offers optional monthly and yearly subscriptions, purchased through the App Store or Google Play.</p>

                    <h3>Managing Or Cancelling Your Subscription</h3>
                    <p>Subscriptions are billed and managed by Apple or Google, not by QOMA directly.</p>
                    <ul>
                        <li><strong>On iPhone/iPad:</strong> open Settings, tap your name, tap Subscriptions, select QOMA, and adjust or cancel there.</li>
                        <li><strong>On Android:</strong> open the Google Play Store app, tap your profile icon, go to Payments &amp; subscriptions, then Subscriptions, and select QOMA.</li>
                    </ul>
                    <p>Cancelling stops future renewals; you'll keep access until the end of the period you already paid for.</p>

                    <h3>Restoring Purchases</h3>
                    <p>If you've reinstalled QOMA or switched devices, open the app's subscription screen and look for a Restore Purchases option. This reconnects your existing subscription using your Apple ID or Google account, at no extra charge.</p>

                    <h3>Playback &amp; Background Audio</h3>
                    <p>QOMA is designed to keep playing after you lock your screen or switch apps. If audio stops unexpectedly, check that Background App Refresh (iOS) is enabled for QOMA, and that battery optimization (Android) isn't set to aggressively restrict the app.</p>

                    <h3>Still Need Help?</h3>
                    <p>Email us and we'll read your message personally.</p>
                    <p><a class="contact-cta" href="mailto:contact@qoma.studio">Get in Touch</a></p>
                `
            },
            jp: {
                title: "サポート",
                updated: "contact@qoma.studio",
                body: `
                    <p>QOMAについてお困りですか? ここでは使い方と、私たちへの直接のご連絡方法をご案内します。</p>

                    <h3>はじめに</h3>
                    <p>QOMAはワンボタンの楽器です。ボタンを押すと、選択したモード(Sleep、Focus、Space)に応じて、その場で新しいアンビエントサウンドが生成されます。まったく同じ形で繰り返されることはありません。</p>

                    <h3>無料での試聴とサブスクリプション</h3>
                    <p>QOMAのすべてのプロファイルは、1日あたりの試聴時間の上限まで無料でお試しいただけます。無制限に聴きたい場合は、App StoreまたはGoogle Playで購入できる任意加入の月額・年額プランをご用意しています。</p>

                    <h3>サブスクリプションの管理・解約</h3>
                    <p>サブスクリプションはQOMAではなく、AppleまたはGoogleによって請求・管理されます。</p>
                    <ul>
                        <li><strong>iPhone/iPadの場合:</strong> 「設定」を開き、ご自身の名前をタップし、「サブスクリプション」に進み、QOMAを選択して変更または解約してください。</li>
                        <li><strong>Androidの場合:</strong> Google Playストアアプリを開き、プロフィールアイコンをタップし、「お支払いと定期購入」から「定期購入」に進み、QOMAを選択してください。</li>
                    </ul>
                    <p>解約すると次回以降の更新が停止しますが、既にお支払い済みの期間の終了まではご利用いただけます。</p>

                    <h3>購入の復元</h3>
                    <p>QOMAを再インストールした場合や機種変更をした場合は、アプリ内のサブスクリプション画面から「購入を復元」を選択してください。追加料金なしで、お使いのApple IDまたはGoogleアカウントに紐づく既存のサブスクリプションが再度有効になります。</p>

                    <h3>再生とバックグラウンド再生</h3>
                    <p>QOMAは、画面をロックしたり他のアプリに切り替えたりした後も再生を続けるよう設計されています。音声が予期せず停止する場合は、iOSでQOMAの「バックグラウンドAppの更新」がオンになっているか、Androidでバッテリー最適化によってアプリが過度に制限されていないかをご確認ください。</p>

                    <h3>それでも解決しない場合</h3>
                    <p>メールでご連絡ください。いただいたメッセージはすべて私たちが直接確認いたします。</p>
                    <p><a class="contact-cta" href="mailto:contact@qoma.studio">お問い合わせ</a></p>
                `
            },
            tr: {
                title: "Destek",
                updated: "contact@qoma.studio",
                body: `
                    <p>QOMA ile ilgili yardıma mı ihtiyacın var? Uygulamanın nasıl çalıştığı ve bize doğrudan nasıl ulaşabileceğin burada.</p>

                    <h3>Başlarken</h3>
                    <p>QOMA tek düğmeli bir enstrümandır. Butona bas, uygulama seçtiğin moda (Uyku, Odaklanma ya da Uzay) göre o anda yeni bir ambiyans sesi üretir. Hiçbir şey tam olarak aynı şekilde tekrar etmez.</p>

                    <h3>Ücretsiz Dinleme ve Abonelik</h3>
                    <p>QOMA'daki her profili, günlük bir dinleme sınırına kadar ücretsiz deneyebilirsin. Sınırsız dinlemek istersen, App Store ya da Google Play üzerinden satın alınan isteğe bağlı aylık ve yıllık abonelikler sunuyoruz.</p>

                    <h3>Aboneliğini Yönetmek ya da İptal Etmek</h3>
                    <p>Abonelikler doğrudan QOMA tarafından değil, Apple ya da Google tarafından faturalandırılır ve yönetilir.</p>
                    <ul>
                        <li><strong>iPhone/iPad'de:</strong> Ayarlar'ı aç, adına dokun, Abonelikler'e gir, QOMA'yı seç, oradan düzenle ya da iptal et.</li>
                        <li><strong>Android'de:</strong> Google Play Store uygulamasını aç, profil simgesine dokun, Ödemeler ve abonelikler'e, ardından Abonelikler'e git, QOMA'yı seç.</li>
                    </ul>
                    <p>İptal etmek gelecekteki yenilemeleri durdurur; zaten ödediğin dönemin sonuna kadar erişimin devam eder.</p>

                    <h3>Satın Alımları Geri Yükleme</h3>
                    <p>QOMA'yı yeniden yüklediysen ya da cihaz değiştirdiysen, uygulamanın abonelik ekranını aç ve Satın Alımları Geri Yükle seçeneğini bul. Bu, Apple ID'ni ya da Google hesabını kullanarak mevcut aboneliğini ekstra ücret almadan yeniden bağlar.</p>

                    <h3>Oynatma ve Arka Plan Sesi</h3>
                    <p>QOMA, ekranını kilitledikten ya da başka bir uygulamaya geçtikten sonra da çalmaya devam edecek şekilde tasarlandı. Ses beklenmedik şekilde durursa, iOS'ta QOMA için Arka Plan Uygulama Yenileme'nin açık olduğundan ve Android'de pil optimizasyonunun uygulamayı agresif şekilde kısıtlamadığından emin ol.</p>

                    <h3>Hâlâ Yardıma mı İhtiyacın Var?</h3>
                    <p>Bize e-posta gönder, her mesajı kişisel olarak okuyoruz.</p>
                    <p><a class="contact-cta" href="mailto:contact@qoma.studio">İletişime Geç</a></p>
                `
            }
        };

        function setLang(lang) {
            document.getElementById('t-title').innerHTML = i18n[lang].title;
            document.getElementById('t-updated').innerHTML = i18n[lang].updated;
            document.getElementById('t-body').innerHTML = i18n[lang].body;

            const buttons = { en: 'btn-en', jp: 'btn-jp', tr: 'btn-tr' };
            Object.keys(buttons).forEach((key) => {
                document.getElementById(buttons[key]).classList.toggle('active', key === lang);
            });
        }

        setLang('en');
    </script>

    <!-- WEBGL, RETINA DPR VE DITHER KALİTE MOTORU -->
    <script>
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl');

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        const vsSource = `
            attribute vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        const fsSource = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uResolution;

            float hash21(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            float valueNoise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                float a = hash21(i);
                float b = hash21(i + vec2(1.0, 0.0));
                float c = hash21(i + vec2(0.0, 1.0));
                float d = hash21(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float amp = 0.5;
                for (int i = 0; i < 4; i++) {
                    v += amp * valueNoise(p);
                    p *= 2.03;
                    amp *= 0.5;
                }
                return v;
            }

            float ditherNoise(vec2 co) {
                return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
            }

            void main() {
                vec2 p = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);
                float t = uTime * 0.14;

                vec2 smokeP = p * 1.5;
                vec2 q = vec2(fbm(smokeP + t * 0.18), fbm(smokeP + vec2(5.2, 1.3) - t * 0.15));
                vec2 r = vec2(
                    fbm(smokeP + 3.2 * q + vec2(1.7, 9.2) + t * 0.12),
                    fbm(smokeP + 3.2 * q + vec2(8.3, 2.8) - t * 0.1)
                );
                float pattern = fbm(smokeP + 3.6 * r);

                vec3 colA = vec3(0.01, 0.01, 0.01);
                vec3 colB = vec3(0.03, 0.03, 0.03);
                vec3 colC = vec3(0.08, 0.08, 0.1);
                vec3 smokeColor = mix(colA, colB, clamp(pattern * 1.5, 0.0, 1.0));
                smokeColor = mix(smokeColor, colC, clamp(r.x * 1.2, 0.0, 1.0));

                float wave1 = sin(length(p) * 8.0 - t * 1.5 + atan(p.y, p.x + 0.001) * 2.0);
                float wave2 = sin(p.x * 6.0 + t * 0.8 + p.y * 3.0);
                float wave3 = sin(p.y * 10.0 - t * 1.2 + p.x * 1.5);

                float interference = wave1 * 0.5 + wave2 * 0.3 + wave3 * 0.2;
                float lines = smoothstep(0.04, 0.0, abs(interference));
                float lines2 = smoothstep(0.02, 0.0, abs(wave1 + wave2 * 0.5));

                float glow = pow(lines, 2.0) * 0.6 + pow(lines2, 1.5) * 0.4;
                vec3 vortexColor = vec3(glow) * 0.7;

                float vignette = smoothstep(1.1, 0.15, length(p));
                vec3 finalColor = (smokeColor + vortexColor) * vignette;

                finalColor += (ditherNoise(gl_FragCoord.xy + uTime) - 0.5) * 0.007;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const vShader = compileShader(gl, gl.VERTEX_SHADER, vsSource);
        const fShader = compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const positionLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

        const uTimeLoc = gl.getUniformLocation(program, 'uTime');
        const uResLoc = gl.getUniformLocation(program, 'uResolution');

        let startTime = Date.now();
        function render() {
            let elapsed = (Date.now() - startTime) / 1000;
            gl.uniform1f(uTimeLoc, elapsed);
            gl.uniform2f(uResLoc, canvas.width, canvas.height);

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render();

        // --- BAĞIMSIZ TİTREŞEN YILDIZLAR ---
        const container = document.getElementById('starsContainer');
        const starCount = 80;

        for (let i = 0; i < starCount; i++) {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;

            const star = document.createElement('div');
            const size = 1.2 + Math.random() * 2.2;
            const baseOpacity = 0.15 + Math.random() * 0.35;

            star.className = 'star';
            star.style.left = x + 'px';
            star.style.top = y + 'px';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.opacity = baseOpacity;
            container.appendChild(star);

            function twitch() {
                const targetOpacity = Math.max(0.02, baseOpacity * (0.2 + Math.random() * 1.2));
                const duration = 800 + Math.random() * 2500;
                star.style.transition = `opacity ${duration}ms ease-in-out`;
                star.style.opacity = targetOpacity;
                setTimeout(twitch, duration);
            }
            setTimeout(twitch, Math.random() * 3000);
        }
    </script>
</body>
