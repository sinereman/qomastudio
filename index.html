<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOMA | Digital Sanctuary</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #vortex-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .center-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qoma-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        .btn-text {
            color: #FFFFFF;
            font-size: 4.5rem;
            font-weight: 200;
            letter-spacing: 1.2rem;
            margin-right: -1.2rem;
            text-transform: uppercase;
            transition: opacity 0.3s ease;
        }

        .qoma-btn:hover .btn-text {
            opacity: 0.85;
        }

        .subtitle {
            font-size: 0.8rem;
            font-weight: 300;
            color: #8E8E96;
            letter-spacing: 0.4rem;
            margin-top: 1.5rem;
            margin-right: -0.4rem;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
        }

        .engineer-credit {
            font-size: 0.65rem;
            font-weight: 500;
            color: #666;
            letter-spacing: 0.25rem;
            text-transform: uppercase;
            margin-top: 1.5rem;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="vortex-canvas"></canvas>

    <div class="center-container">
        <button class="qoma-btn" onclick="location.reload()">
            <span class="btn-text">QOMA</span>
        </button>

        <div class="subtitle">Digital Sanctuary</div>
        <div class="engineer-credit">engineered by B. B. KURSAT</div>
    </div>

    <script>
        const canvas = document.getElementById('vortex-canvas');
        const gl = canvas.getContext('webgl');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        const vsSource = `
            attribute vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        const fsSource = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uResolution;

            void main() {
                // Koordinat merkezini (0,0) doğrudan ekranın tam ortasına sabitliyoruz
                vec2 p = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);
                float t = uTime * 0.14;

                float wave1 = sin(length(p) * 8.0 - t * 1.5 + atan(p.y, p.x + 0.001) * 2.0);
                float wave2 = sin(p.x * 6.0 + t * 0.8 + p.y * 3.0);
                float wave3 = sin(p.y * 10.0 - t * 1.2 + p.x * 1.5);

                float interference = wave1 * 0.5 + wave2 * 0.3 + wave3 * 0.2;

                float lines = smoothstep(0.04, 0.0, abs(interference));
                float lines2 = smoothstep(0.02, 0.0, abs(wave1 + wave2 * 0.5));

                float glow = pow(lines, 2.0) * 0.6 + pow(lines2, 1.5) * 0.4;
                float vignette = smoothstep(0.9, 0.15, length(p));

                vec3 color = vec3(glow) * vignette * 0.7;
                gl_FragColor = vec4(color, glow * vignette);
            }
        `;

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const vShader = compileShader(gl, gl.VERTEX_SHADER, vsSource);
        const fShader = compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const positionLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

        const uTimeLoc = gl.getUniformLocation(program, 'uTime');
        const uResLoc = gl.getUniformLocation(program, 'uResolution');

        let startTime = Date.now();
        function render() {
            let elapsed = (Date.now() - startTime) / 1000;
            gl.uniform1f(uTimeLoc, elapsed);
            gl.uniform2f(uResLoc, canvas.width, canvas.height);

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
