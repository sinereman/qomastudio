<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOMA | Digital Sanctuary</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Arka Plan GLSL Vortex Çizgileri */
        #vortex-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Bağımsız Titreşen Yıldızlar Katmanı */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            transition: opacity 1.5s ease-in-out;
        }

        /* Merkez Konteyner */
        .center-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Dairesel Merkez Buton (App.js Stili) */
        .qoma-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #232326 0%, #0c0c0e 70%, #000000 100%);
            border: 1px solid rgba(183, 183, 194, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 45px rgba(183, 183, 194, 0.3);
            transition: transform 0.2s ease;
            outline: none;
        }

        .qoma-btn:active {
            transform: scale(0.92);
        }

        /* Buton İç Bezel ve Işıma */
        .btn-bezel {
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            pointer-events: none;
        }

        .btn-notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            border-radius: 1px;
            background-color: #B7B7C2;
            opacity: 0.55;
            pointer-events: none;
        }

        .btn-text {
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 5px;
            text-transform: lowercase;
            margin-left: 5px;
        }

        /* Alt Yazılar ve Mühür (App.js Metinleri ve Hizalamaları) */
        .subtitle {
            font-size: 13px;
            font-weight: 300;
            color: #8E8E96;
            letter-spacing: 1.5px;
            margin-top: 32px;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
        }

        .engineer-credit {
            font-size: 10px;
            font-weight: 500;
            color: #666;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 12px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Arka Plan Vortex Shader (App.js VortexShader Birebir) -->
    <canvas id="vortex-canvas"></canvas>

    <!-- Bağımsız Yanıp Sönen Yıldızlar (App.js Star Bileşeni) -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Merkez Arayüz -->
    <div class="center-container">
        <button class="qoma-btn" onclick="location.reload()">
            <div class="btn-bezel"></div>
            <div class="btn-notch"></div>
            <span class="btn-text">qoma</span>
        </button>

        <div class="subtitle">Digital Sanctuary</div>
        <div class="engineer-credit">engineered by B. B. KURSAT</div>
    </div>

    <!-- Scriptler: Vortex Shader + Bağımsız Yıldız Matrisi -->
    <script>
        // --- 1. VORTEX SHADER (App.js VortexShader Kaynağı Birebir) ---
        const canvas = document.getElementById('vortex-canvas');
        const gl = canvas.getContext('webgl');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        const vsSource = `
            attribute vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        const fsSource = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uResolution;

            void main() {
                vec2 uv = gl_FragCoord.xy / uResolution.xy;
                vec2 p = (uv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);
                float t = uTime * 0.14;

                float wave1 = sin(length(p) * 8.0 - t * 1.5 + atan(p.y, p.x + 0.001) * 2.0);
                float wave2 = sin(p.x * 6.0 + t * 0.8 + p.y * 3.0);
                float wave3 = sin(p.y * 10.0 - t * 1.2 + p.x * 1.5);

                float interference = wave1 * 0.5 + wave2 * 0.3 + wave3 * 0.2;

                float lines = smoothstep(0.04, 0.0, abs(interference));
                float lines2 = smoothstep(0.02, 0.0, abs(wave1 + wave2 * 0.5));

                float glow = pow(lines, 2.0) * 0.6 + pow(lines2, 1.5) * 0.4;
                float vignette = smoothstep(0.9, 0.15, length(p));

                vec3 color = vec3(glow) * vignette * 0.7;
                gl_FragColor = vec4(color, glow * vignette);
            }
        `;

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const vShader = compileShader(gl, gl.VERTEX_SHADER, vsSource);
        const fShader = compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const positionLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

        const uTimeLoc = gl.getUniformLocation(program, 'uTime');
        const uResLoc = gl.getUniformLocation(program, 'uResolution');

        let startTime = Date.now();
        function render() {
            let elapsed = (Date.now() - startTime) / 1000;
            gl.uniform1f(uTimeLoc, elapsed);
            gl.uniform2f(uResLoc, canvas.width, canvas.height);

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render();

        // --- 2. BAĞIMSIZ TİTREŞEN YILDIZLAR (App.js Star Bileşeni Mantığı) ---
        const container = document.getElementById('starsContainer');
        const starCount = 90;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const exclusionRadius = 90; // Buton üzerine yıldız gelmesin

        for (let i = 0; i < starCount; i++) {
            let x, y;
            do {
                x = Math.random() * window.innerWidth;
                y = Math.random() * window.innerHeight;
            } while (Math.hypot(x - centerX, y - centerY) < exclusionRadius);

            const star = document.createElement('div');
            const size = 1.2 + Math.random() * 2.2;
            const baseOpacity = 0.15 + Math.random() * 0.35;
            
            star.className = 'star';
            star.style.left = x + 'px';
            star.style.top = y + 'px';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.opacity = baseOpacity;
            container.appendChild(star);

            // Her yıldız kendi bağımsız hızında ve rastgele aralıklarla yanıp söner
            function twitch() {
                const targetOpacity = Math.max(0.02, baseOpacity * (0.2 + Math.random() * 1.2));
                const duration = 800 + Math.random() * 2500;
                star.style.transition = `opacity ${duration}ms ease-in-out`;
                star.style.opacity = targetOpacity;
                setTimeout(twitch, duration);
            }
            setTimeout(twitch, Math.random() * 3000);
        }
    </script>
</body>
</html>
