<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOMA | Digital Sanctuary</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. Katman: Duman ve Vortex Shader'ı */
        #glcanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 2. Katman: Bağımsız Yıldızlar */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            transition: opacity 1.5s ease-in-out;
        }

        /* 3. Katman: Arayüz (UI) */
        .center-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Dairesi/Çerçevesi Olmayan Sadece Yazı Butonu */
        .qoma-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        .btn-text {
            color: #FFFFFF;
            font-size: 5.5rem; /* Görseldeki gibi devasa ve ince */
            font-weight: 300;
            letter-spacing: 1.8rem;
            /* Harf aralığından (letter-spacing) kaynaklı sağa kaymayı önlemek için */
            margin-right: -1.8rem; 
            text-transform: uppercase;
            transition: opacity 0.3s ease, text-shadow 0.3s ease;
        }

        .qoma-btn:hover .btn-text {
            opacity: 0.8;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8E8E96;
            letter-spacing: 0.5rem;
            margin-top: 2rem;
            margin-right: -0.5rem;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
        }

        .engineer-credit {
            font-size: 0.65rem;
            font-weight: 500;
            color: #444444;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            margin-top: 1.5rem;
            margin-right: -0.3rem;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Duman ve Vortex -->
    <canvas id="glcanvas"></canvas>

    <!-- Yıldızlar -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- UI: QOMA -->
    <div class="center-container">
        <button class="qoma-btn" onclick="location.reload()">
            <div class="btn-text">QOMA</div>
        </button>

        <div class="subtitle">Digital Sanctuary</div>
        <div class="engineer-credit">engineered by B. B. KURSAT</div>
    </div>

    <script>
        // --- 1. DUMAN VE VORTEX BİRLEŞİK SHADER (app.js Birebir Uyarlama) ---
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        const vsSource = `
            attribute vec2 position;
            void main() {
                gl_Position = vec4(position, 0.0, 1.0);
            }
        `;

        const fsSource = `
            precision highp float;
            uniform float uTime;
            uniform vec2 uResolution;

            // Duman (FBM) Matematiği
            float hash21(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            float valueNoise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                float a = hash21(i);
                float b = hash21(i + vec2(1.0, 0.0));
                float c = hash21(i + vec2(0.0, 1.0));
                float d = hash21(i + vec2(1.0, 1.0));
                vec2 u = f * f * (3.0 - 2.0 * f);
                return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }

            float fbm(vec2 p) {
                float v = 0.0;
                float amp = 0.5;
                for (int i = 0; i < 4; i++) {
                    v += amp * valueNoise(p);
                    p *= 2.03;
                    amp *= 0.5;
                }
                return v;
            }

            void main() {
                // Koordinatları tam merkeze oturtma
                vec2 p = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.x, uResolution.y);
                float t = uTime * 0.14;

                // KATMAN 1: Duman / Akışkan Arka Plan
                vec2 smokeP = p * 1.5;
                vec2 q = vec2(fbm(smokeP + t * 0.18), fbm(smokeP + vec2(5.2, 1.3) - t * 0.15));
                vec2 r = vec2(
                    fbm(smokeP + 3.2 * q + vec2(1.7, 9.2) + t * 0.12),
                    fbm(smokeP + 3.2 * q + vec2(8.3, 2.8) - t * 0.1)
                );
                float pattern = fbm(smokeP + 3.6 * r);
                
                vec3 colA = vec3(0.005, 0.005, 0.005);
                vec3 colB = vec3(0.02, 0.02, 0.02);
                vec3 colC = vec3(0.05, 0.05, 0.06);
                vec3 smokeColor = mix(colA, colB, clamp(pattern * 1.2, 0.0, 1.0));
                smokeColor = mix(smokeColor, colC, clamp(r.x * 0.8, 0.0, 1.0));

                // KATMAN 2: Vortex Çizgileri
                float wave1 = sin(length(p) * 8.0 - t * 1.5 + atan(p.y, p.x + 0.001) * 2.0);
                float wave2 = sin(p.x * 6.0 + t * 0.8 + p.y * 3.0);
                float wave3 = sin(p.y * 10.0 - t * 1.2 + p.x * 1.5);

                float interference = wave1 * 0.5 + wave2 * 0.3 + wave3 * 0.2;
                float lines = smoothstep(0.04, 0.0, abs(interference));
                float lines2 = smoothstep(0.02, 0.0, abs(wave1 + wave2 * 0.5));

                float glow = pow(lines, 2.0) * 0.6 + pow(lines2, 1.5) * 0.4;
                vec3 vortexColor = vec3(glow) * 0.7;

                // Vinyet ve Birleştirme
                float vignette = smoothstep(1.1, 0.15, length(p));
                vec3 finalColor = (smokeColor + vortexColor) * vignette;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        function compileShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const vShader = compileShader(gl, gl.VERTEX_SHADER, vsSource);
        const fShader = compileShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vShader);
        gl.attachShader(program, fShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const positionLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(positionLoc);
        gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

        const uTimeLoc = gl.getUniformLocation(program, 'uTime');
        const uResLoc = gl.getUniformLocation(program, 'uResolution');

        let startTime = Date.now();
        function render() {
            let elapsed = (Date.now() - startTime) / 1000;
            gl.uniform1f(uTimeLoc, elapsed);
            gl.uniform2f(uResLoc, canvas.width, canvas.height);

            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        render();

        // --- 2. BAĞIMSIZ TİTREŞEN YILDIZLAR ---
        const container = document.getElementById('starsContainer');
        const starCount = 80;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const exclusionRadius = 160; // QOMA yazısının arkasında yıldız olmasın diye boşluk

        for (let i = 0; i < starCount; i++) {
            let x, y;
            let attempts = 0;
            do {
                x = Math.random() * window.innerWidth;
                y = Math.random() * window.innerHeight;
                attempts++;
            } while (Math.hypot(x - centerX, y - centerY) < exclusionRadius && attempts < 20);

            const star = document.createElement('div');
            const size = 1.2 + Math.random() * 2.2;
            const baseOpacity = 0.15 + Math.random() * 0.35;
            
            star.className = 'star';
            star.style.left = x + 'px';
            star.style.top = y + 'px';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.opacity = baseOpacity;
            container.appendChild(star);

            function twitch() {
                const targetOpacity = Math.max(0.02, baseOpacity * (0.2 + Math.random() * 1.2));
                const duration = 800 + Math.random() * 2500;
                star.style.transition = `opacity ${duration}ms ease-in-out`;
                star.style.opacity = targetOpacity;
                setTimeout(twitch, duration);
            }
            setTimeout(twitch, Math.random() * 3000);
        }
    </script>
</body>
</html>
